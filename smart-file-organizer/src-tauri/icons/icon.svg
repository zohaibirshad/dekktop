<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#grad)"/>
  <g fill="white" transform="translate(256, 256)">
    <!-- Folder icon -->
    <path d="M -120,-80 L -120,80 L 120,80 L 120,-80 Z" fill="none" stroke="white" stroke-width="8"/>
    <path d="M -120,-80 L -40,-80 L -20,-120 L 120,-120 L 120,-80" fill="none" stroke="white" stroke-width="8"/>
    <!-- Document icon inside folder -->
    <rect x="-60" y="-40" width="80" height="100" rx="4" fill="white" opacity="0.9"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#667eea" stroke-width="4"/>
    <line x1="-40" y1="10" x2="40" y2="10" stroke="#667eea" stroke-width="4"/>
    <line x1="-40" y1="30" x2="20" y2="30" stroke="#667eea" stroke-width="4"/>
    <!-- Search magnifying glass -->
    <circle cx="60" cy="60" r="30" fill="none" stroke="white" stroke-width="8"/>
    <line x1="82" y1="82" x2="110" y2="110" stroke="white" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
